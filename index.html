<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Книжный прогноз">
  <meta name="description" content="Персональный прогноз оценки книг на основе истории чтения.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Мой книжный прогноз</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="pageEyebrow">Мой книжный прогноз</p>
        <h1 id="pageTitle">Главная</h1>
      </div>
      <div class="topbar-actions">
        <button class="icon-button" id="searchButton" aria-label="Поиск">⌕</button>
        <button class="icon-button" id="settingsButton" aria-label="Настройки">⋯</button>
      </div>
    </header>

    <main id="mainContent" class="main-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="nav-item active" data-page="home"><span>⌂</span><small>Главная</small></button>
      <button class="nav-item" data-page="want"><span>♡</span><small>Хочу</small></button>
      <button class="nav-item" data-page="read"><span>▣</span><small>Прочитано</small></button>
      <button class="nav-item" data-page="profile"><span>◉</span><small>Профиль</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="starter-data.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
